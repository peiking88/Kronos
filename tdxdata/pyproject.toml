[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tdxdata"
version = "0.8.4"
description = "TDX market data reader library based on mootdx"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "mootdx>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.setuptools.packages.find]
include = ["tdxdata*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: marks tests that require real network connection (deselect with '-m \"not live\"')",
    "local: marks tests that require local TDX data files (deselect with '-m \"not local\"')",
]
